spring.application.name=Certifai-Test
server.port=8080
server.servlet.context-path=/certifai

# H2 In-Memory Database for automated integration tests
spring.datasource.url=jdbc:h2:mem:certifai_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Test Admin Credentials
admin.email=admin@certifai.test
admin.password=admin123
admin.name=ADMIN_TEST

# Home by Role
security.redirect.roles.ADMIN=/admin/home
security.redirect.roles.ESTUDANTE=/estudante/home
security.redirect.roles.PROFESSOR=/professor/home

# Logout
app.security.logout.success-url=/certifai/login
app.security.logout.add-timestamp-param=true

# Swagger / OpenAPI
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Origin,Content-Type,Accept,Authorization,X-Requested-With
app.cors.exposed-headers=Authorization,Content-Disposition

# Test JWT Secret
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Test Logging
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.br.com.certifai=INFO

# SendGrid Mock Config
sendgrid.api-key=SG.test_mock_api_key
sendgrid.sender-email=test@certifai.com
app.base-url=http://localhost:8080/certifai

# Google OAuth2 Mock Config
spring.security.oauth2.client.registration.google.client-id=mock-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
