spring.application.name=Certifai

# Server Port Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/certifai

# Spring Datasource configuration
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/certifai_db}
spring.datasource.username=${DATASOURCE_USERNAME:certifai_user}
spring.datasource.password=${DATASOURCE_PASSWORD:certifai_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ADMIN Config
admin.email=${ADMIN_EMAIL:admin@certifai.com.br}
admin.password=${ADMIN_PASSWORD:admin123}

# Home by Role
security.redirect.roles.ADMIN=/admin/home
security.redirect.roles.ESTUDANTE=/estudante/home
security.redirect.roles.PROFESSOR=/professor/home

# Logout
app.security.logout.success-url=/certifai/login
app.security.logout.add-timestamp-param=true

# Swagger/OpenAPI Config
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.show-actuator=true

# CORS Config
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://certifai-front-ruby.vercel.app,http://localhost:3000,http://localhost:5173}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Origin,Content-Type,Accept,Authorization,X-Requested-With
app.cors.exposed-headers=Authorization,Content-Disposition

# Security / JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Structured Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.br.com.certifai=DEBUG

# SendGrid Configuration
sendgrid.api-key=${SENDGRID_API_KEY:SG.placeholder}
sendgrid.sender-email=${SENDGRID_SENDER_EMAIL:certifai.suporte@gmail.com}
app.base-url=${APP_BASE_URL:https://certifai-backend.onrender.com/certifai}

# Google OAuth2 Login
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
